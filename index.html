<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>تطبيق أفيا</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تطبيق أفيا">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f4236">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* white matches the app's bottom menu, so any strip the phone leaves under it looks like part of the menu */
  html,body{margin:0;height:100%;overflow:hidden;background:#fff}
  /* the app fills the whole screen; it pads its own header and bottom menu by the sizes this page sends it */
  #wrap{position:fixed;top:0;left:0;right:0;height:100%;overflow:hidden;background:#f6f1e7}
  /* Google's notice bar is pushed above the visible area (sizes set in the script) */
  #f{position:absolute;left:0;top:0;width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .25s}
  #f.on{opacity:1}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0f4236;color:#f1ead8;font:600 15px system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;z-index:4;transition:opacity .3s}
  #load img{width:84px;height:84px;border-radius:20px}
  #load.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" title="تطبيق أفيا" credentialless referrerpolicy="no-referrer" allow="camera; microphone; clipboard-write"></iframe></div>
<div id="load"><img src="icon-180.png" alt=""><div>جارٍ فتح تطبيق أفيا…</div></div>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbwNI-qJHX5tGMEYdV-zv53U4EbhIi8cLq-eo-FBYxI4uIEklEaiBeaQGlM4aroPx5S2AQ/exec';
  // one id per phone, kept by this page so the app can recognise the phone for 3 days after a login
  var dev = null;
  try { dev = localStorage.getItem('avia_dev'); } catch (e) {}
  if (!dev) {
    var a = new Uint8Array(16); crypto.getRandomValues(a);
    dev = 'd' + Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    try { localStorage.setItem('avia_dev', dev); } catch (e) {}
  }
  var f = document.getElementById('f'), wrap = document.getElementById('wrap'), load = document.getElementById('load');
  var crop = 0, shown = false, lastIh = 0, sent = false;
  function show() { if (shown) return; shown = true; f.className = 'on'; load.className = 'gone'; }
  // size the frame in exact pixels: taller than the visible area by the height of Google's notice bar, and shifted up by it
  function fit() { var h = window.innerHeight; wrap.style.height = h + 'px'; f.style.top = (-crop) + 'px'; f.style.height = (h + crop) + 'px'; }
  // clock bar (top) and home bar (bottom) sizes; on some iPhones the page stops short of the screen bottom, and the home bar then sits in that strip
  function insets() {
    var p = document.createElement('div'); p.style.cssText = 'position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:0;width:1px;visibility:hidden';
    document.body.appendChild(p); var r = p.getBoundingClientRect(); p.remove();
    var t = Math.max(0, Math.round(r.top)), b = Math.max(0, Math.round(innerHeight - r.bottom)), gap = 0;
    if (navigator.standalone && innerHeight > innerWidth && screen.height > innerHeight) gap = Math.round(screen.height - innerHeight);
    return { t: t, b: Math.max(0, b - gap), rawB: b, gap: gap };
  }
  var appWin = null;
  function sendInsets() { if (!appWin) return; var i = insets(); try { appWin.postMessage({ avia: 'ins', t: i.t, b: i.b }, '*'); } catch (e) {} }
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || m.avia !== 'h' || !(m.ih > 100)) return;
    lastIh = m.ih; if (e.source && e.source !== appWin) { appWin = e.source; sendInsets(); }
    var bar = Math.round(f.offsetHeight - m.ih);
    if (bar >= 0 && bar < 200 && Math.abs(bar - crop) > 1) { crop = bar; fit(); }
    show();
    if (!sent) { sent = true; setTimeout(report, 4000); }
  });
  window.addEventListener('resize', function () { fit(); sendInsets(); });
  // one measurement per opening, so problems on a particular phone can be seen and fixed
  function report() {
    var i = insets();
    var info = JSON.stringify({ wrap: 2, W: innerWidth, H: innerHeight, SH: screen.height, wrapH: wrap.clientHeight, fH: f.offsetHeight, crop: crop, ih: lastIh, sat: i.t, sab: i.rawB, gap: i.gap, sent: !!appWin, sa: !!navigator.standalone, ua: navigator.userAgent });
    try { fetch(APP + '?wdiag=' + encodeURIComponent(info), { mode: 'no-cors' }); } catch (e) {}
  }
  setTimeout(show, 12000);
  fit();
  f.src = APP + '?d=' + encodeURIComponent(dev);
</script>
</body>
</html>
